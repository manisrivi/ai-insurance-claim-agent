<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3faf8"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f3d36" flood-opacity="0.15"/></filter>
  </defs>

  <rect width="1000" height="1200" rx="24" fill="url(#bg)"/>

  <!-- ================= TITLE ================= -->
  <text x="150" y="105" font-size="46" font-weight="800" fill="#111827">HOW</text>
  <rect x="268" y="56" width="420" height="66" rx="8" fill="#0f766e"/>
  <text x="478" y="105" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">CLAIMCARE AI</text>
  <text x="706" y="105" font-size="46" font-weight="800" fill="#111827">WORKS</text>
  <text x="500" y="150" font-size="18" fill="#4b5563" text-anchor="middle">LangGraph agent · RAG · Fraud checks · Human-in-the-loop</text>

  <!-- ================= ROW 1: CUSTOMER → UI → API ================= -->
  <!-- Customer -->
  <g filter="url(#sh)">
    <circle cx="130" cy="250" r="62" fill="#ccfbf1"/>
  </g>
  <circle cx="130" cy="232" r="20" fill="#0f766e"/>
  <path d="M95,285 q35,-42 70,0 z" fill="#0f766e"/>
  <rect x="112" y="262" width="36" height="24" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="130" y="279" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">PDF</text>
  <text x="130" y="342" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">Customer</text>

  <!-- Next.js UI (browser window) -->
  <g filter="url(#sh)">
    <rect x="345" y="190" width="230" height="140" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  </g>
  <path d="M345,202 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v16 h-230 z" fill="#0f766e"/>
  <circle cx="362" cy="205" r="4" fill="#fca5a5"/><circle cx="376" cy="205" r="4" fill="#fde68a"/><circle cx="390" cy="205" r="4" fill="#86efac"/>
  <rect x="365" y="232" width="90" height="12" rx="4" fill="#e5e7eb"/>
  <rect x="465" y="232" width="90" height="12" rx="4" fill="#e5e7eb"/>
  <rect x="365" y="252" width="190" height="12" rx="4" fill="#e5e7eb"/>
  <rect x="365" y="272" width="190" height="24" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-dasharray="4 3"/>
  <text x="460" y="289" font-size="11" fill="#0f766e" text-anchor="middle">hospital_bill.pdf</text>
  <rect x="495" y="304" width="60" height="16" rx="4" fill="#0f766e"/>
  <text x="525" y="316" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Submit</text>
  <text x="460" y="358" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">Next.js UI</text>

  <!-- FastAPI (server) -->
  <g filter="url(#sh)">
    <rect x="765" y="195" width="170" height="40" rx="8" fill="#134e4a"/>
    <rect x="765" y="241" width="170" height="40" rx="8" fill="#134e4a"/>
    <rect x="765" y="287" width="170" height="40" rx="8" fill="#134e4a"/>
  </g>
  <circle cx="785" cy="215" r="6" fill="#4ade80"/><circle cx="805" cy="215" r="6" fill="#4ade80"/>
  <circle cx="785" cy="261" r="6" fill="#4ade80"/><circle cx="805" cy="261" r="6" fill="#4ade80"/>
  <circle cx="785" cy="307" r="6" fill="#4ade80"/><circle cx="805" cy="307" r="6" fill="#4ade80"/>
  <text x="870" y="267" font-size="22" font-weight="800" fill="#5eead4" text-anchor="middle">⚡ API</text>
  <text x="850" y="358" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">FastAPI</text>

  <!-- Customer → UI -->
  <path d="M195,240 L338,240" stroke="#e11d48" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#aRed)"/>
  <text x="266" y="228" font-size="14" font-weight="600" fill="#e11d48" text-anchor="middle">form + bill</text>
  <!-- UI → Customer (status) -->
  <path d="M338,290 L198,290" stroke="#e11d48" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round" fill="none" marker-end="url(#aRed)"/>
  <text x="266" y="314" font-size="14" font-weight="600" fill="#e11d48" text-anchor="middle">Claim ID + status</text>
  <!-- UI → API -->
  <path d="M580,240 L758,240" stroke="#e11d48" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#aRed)"/>
  <text x="668" y="228" font-size="14" font-weight="600" fill="#e11d48" text-anchor="middle">POST /claims</text>

  <!-- ================= ROW 2: AGENT + DATA ================= -->
  <!-- Agent container -->
  <rect x="40" y="420" width="640" height="420" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="60" y="406" width="250" height="30" rx="15" fill="#0d9488"/>
  <text x="185" y="427" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">🧠 LangGraph Agent</text>

  <!-- Nodes row -->
  <g filter="url(#sh)">
    <rect x="70" y="465" width="160" height="80" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect x="280" y="465" width="160" height="80" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect x="490" y="465" width="160" height="80" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  </g>
  <text x="150" y="498" font-size="18" font-weight="800" fill="#0f766e" text-anchor="middle">📄 Document</text>
  <text x="150" y="522" font-size="13" fill="#4b5563" text-anchor="middle">read the bill</text>
  <text x="150" y="538" font-size="13" fill="#4b5563" text-anchor="middle">compare with form</text>
  <text x="360" y="498" font-size="18" font-weight="800" fill="#0f766e" text-anchor="middle">📚 Policy</text>
  <text x="360" y="522" font-size="13" fill="#4b5563" text-anchor="middle">RAG search</text>
  <text x="360" y="538" font-size="13" fill="#4b5563" text-anchor="middle">+ citation check</text>
  <text x="570" y="498" font-size="18" font-weight="800" fill="#0f766e" text-anchor="middle">🔍 Fraud</text>
  <text x="570" y="522" font-size="13" fill="#4b5563" text-anchor="middle">rules + history</text>
  <text x="570" y="538" font-size="13" fill="#4b5563" text-anchor="middle">+ LLM risk</text>
  <path d="M232,505 L273,505" stroke="#0d9488" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aTeal)"/>
  <path d="M442,505 L483,505" stroke="#0d9488" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aTeal)"/>

  <!-- Decide diamond -->
  <path d="M570,547 L570,590" stroke="#0d9488" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aTeal)"/>
  <g filter="url(#sh)">
    <path d="M570,598 L640,648 L570,698 L500,648 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  </g>
  <text x="570" y="645" font-size="16" font-weight="800" fill="#92400e" text-anchor="middle">⚖️ Decide</text>
  <text x="570" y="664" font-size="11" fill="#92400e" text-anchor="middle">rules in code</text>

  <!-- Finalize -->
  <g filter="url(#sh)">
    <rect x="70" y="615" width="200" height="66" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="170" y="643" font-size="18" font-weight="800" fill="#166534" text-anchor="middle">✅ Finalize</text>
  <text x="170" y="664" font-size="13" fill="#166534" text-anchor="middle">approved / rejected</text>
  <path d="M498,648 L278,648" stroke="#0d9488" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aTeal)"/>
  <text x="388" y="636" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">clear case</text>

  <!-- Officer pause -->
  <path d="M570,700 L570,733" stroke="#ea580c" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aOrange)"/>
  <text x="583" y="722" font-size="13" font-weight="700" fill="#ea580c">risky</text>
  <g filter="url(#sh)">
    <rect x="480" y="740" width="180" height="66" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  </g>
  <text x="570" y="768" font-size="18" font-weight="800" fill="#9a3412" text-anchor="middle">⏸️ Officer review</text>
  <text x="570" y="790" font-size="13" fill="#9a3412" text-anchor="middle">interrupt() · wait</text>
  <!-- resume → finalize -->
  <path d="M478,773 L170,773 L170,688" stroke="#ea580c" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aOrange)"/>
  <text x="320" y="764" font-size="13" font-weight="700" fill="#ea580c" text-anchor="middle">resume after decision</text>

  <!-- Right column: data stores + LLM -->
  <!-- Supabase -->
  <g filter="url(#sh)">
    <path d="M760,440 v80 a90,18 0 0 0 180,0 v-80" fill="#10b981"/>
    <ellipse cx="850" cy="440" rx="90" ry="18" fill="#34d399"/>
  </g>
  <path d="M760,480 a90,18 0 0 0 180,0" fill="none" stroke="#065f46" stroke-width="1.5" opacity="0.5"/>
  <text x="850" y="500" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">Supabase</text>
  <text x="850" y="520" font-size="12" fill="#ecfdf5" text-anchor="middle">claims + checkpoints</text>

  <!-- ChromaDB -->
  <g filter="url(#sh)">
    <path d="M760,600 v80 a90,18 0 0 0 180,0 v-80" fill="#7c3aed"/>
    <ellipse cx="850" cy="600" rx="90" ry="18" fill="#a78bfa"/>
  </g>
  <path d="M760,640 a90,18 0 0 0 180,0" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.5"/>
  <text x="850" y="660" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">ChromaDB</text>
  <text x="850" y="680" font-size="12" fill="#ede9fe" text-anchor="middle">policy vectors</text>

  <!-- LLM -->
  <g filter="url(#sh)">
    <rect x="760" y="745" width="180" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="850" y="778" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">✨ Gemini</text>
  <text x="850" y="802" font-size="13" fill="#1e40af" text-anchor="middle">Claude as backup</text>

  <!-- API → Supabase -->
  <path d="M900,330 L900,410" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aPurple)"/>
  <text x="910" y="378" font-size="13" font-weight="700" fill="#7c3aed">save</text>
  <!-- API → Agent -->
  <path d="M790,330 L790,385 L620,385 L620,412" stroke="#0d9488" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aTeal)"/>
  <text x="705" y="378" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">background task</text>
  <!-- Agent ↔ Supabase -->
  <path d="M684,470 L752,470" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-start="url(#aPurple)" marker-end="url(#aPurple)"/>
  <!-- Agent → ChromaDB -->
  <path d="M684,630 L752,630" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aPurple)"/>
  <text x="718" y="620" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">RAG</text>
  <!-- Agent → LLM -->
  <path d="M684,785 L752,785" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#aBlue)"/>
  <text x="718" y="775" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">LLM</text>

  <!-- ================= ROW 3: OFFICER ================= -->
  <!-- Officer -->
  <g filter="url(#sh)">
    <circle cx="130" cy="960" r="62" fill="#ffedd5"/>
  </g>
  <circle cx="130" cy="942" r="20" fill="#ea580c"/>
  <path d="M95,995 q35,-42 70,0 z" fill="#ea580c"/>
  <rect x="122" y="968" width="16" height="16" rx="3" fill="#ffffff"/>
  <text x="130" y="980" font-size="11" fill="#ea580c" text-anchor="middle">★</text>
  <text x="130" y="1052" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">Officer</text>

  <!-- Officer dashboard -->
  <g filter="url(#sh)">
    <rect x="345" y="895" width="290" height="140" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  </g>
  <path d="M345,907 a12,12 0 0 1 12,-12 h266 a12,12 0 0 1 12,12 v16 h-290 z" fill="#ea580c"/>
  <circle cx="362" cy="910" r="4" fill="#fff"/><circle cx="376" cy="910" r="4" fill="#fff"/><circle cx="390" cy="910" r="4" fill="#fff"/>
  <rect x="362" y="936" width="256" height="18" rx="4" fill="#fee2e2"/>
  <text x="372" y="949" font-size="11" fill="#991b1b">John Doe · Mismatch</text>
  <rect x="362" y="960" width="256" height="18" rx="4" fill="#fef3c7"/>
  <text x="372" y="973" font-size="11" fill="#92400e">Arun · Unreadable bill</text>
  <rect x="362" y="984" width="256" height="18" rx="4" fill="#dbeafe"/>
  <text x="372" y="997" font-size="11" fill="#1e40af">Ravi · Needs review</text>
  <rect x="490" y="1008" width="60" height="18" rx="4" fill="#16a34a"/>
  <text x="520" y="1021" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Approve</text>
  <rect x="558" y="1008" width="60" height="18" rx="4" fill="#dc2626"/>
  <text x="588" y="1021" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Reject</text>
  <text x="490" y="1063" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">Officer dashboard</text>

  <!-- Officer → dashboard -->
  <path d="M195,960 L338,960" stroke="#ea580c" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#aOrange)"/>
  <text x="266" y="948" font-size="14" font-weight="600" fill="#ea580c" text-anchor="middle">approve / reject</text>
  <!-- dashboard → officer node (resume) -->
  <path d="M600,893 L600,815" stroke="#ea580c" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#aOrange)"/>
  <text x="612" y="862" font-size="13" font-weight="700" fill="#ea580c">decision</text>

  <!-- Security badge (right of row 3) -->
  <g filter="url(#sh)">
    <rect x="700" y="895" width="250" height="140" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  </g>
  <text x="825" y="925" font-size="16" font-weight="800" fill="#0f766e" text-anchor="middle">🛡️ Built-in safety</text>
  <text x="720" y="952" font-size="13" fill="#374151">• Prompt-injection guard</text>
  <text x="720" y="974" font-size="13" fill="#374151">• Business rules in code</text>
  <text x="720" y="996" font-size="13" fill="#374151">• Rate limits · random IDs</text>
  <text x="720" y="1018" font-size="13" fill="#374151">• AI fails → goes to officer</text>

  <!-- ================= LEGEND ================= -->
  <line x1="40" y1="1100" x2="960" y2="1100" stroke="#e5e7eb" stroke-width="2"/>
  <g font-size="14" font-weight="600">
    <line x1="60" y1="1140" x2="100" y2="1140" stroke="#e11d48" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="110" y="1145" fill="#374151">Customer flow</text>
    <line x1="240" y1="1140" x2="280" y2="1140" stroke="#0d9488" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="290" y="1145" fill="#374151">Agent steps</text>
    <line x1="410" y1="1140" x2="450" y2="1140" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="460" y="1145" fill="#374151">Data</text>
    <line x1="530" y1="1140" x2="570" y2="1140" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="580" y="1145" fill="#374151">LLM</text>
    <line x1="650" y1="1140" x2="690" y2="1140" stroke="#ea580c" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="700" y="1145" fill="#374151">Human-in-the-loop</text>
  </g>
</svg>
