# docker compose up --build   -> starts backend (8000) + frontend (3000)
# docker compose down         -> stops both
# For a live site set PUBLIC_API_URL (backend address seen by browsers) before building.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env          # secrets stay in .env on your machine, never inside the image
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db    # keeps the policy vectors between restarts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}   # the browser calls the backend here
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy    # wait until the API answers /health
    restart: unless-stopped

volumes:
  chroma_data:
